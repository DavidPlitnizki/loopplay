<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>21 Boom</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0f0f0f;
        color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 2rem;
      }

      h1 {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        font-size: 1.125rem;
        color: #a3a3a3;
        max-width: 28rem;
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        background: #262626;
        border: 1px solid #404040;
        border-radius: 9999px;
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: #a3a3a3;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      button {
        margin-top: 0.5rem;
        background: #f5f5f5;
        color: #0f0f0f;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }

      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="badge">Coming Soon</span>
      <h1>21 Boom</h1>
      <p>
        A fast-paced number game. Count to 21 — but don't say boom. Challenge
        your friends and climb the leaderboard.
      </p>
      <button id="start-btn">Start Game</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
